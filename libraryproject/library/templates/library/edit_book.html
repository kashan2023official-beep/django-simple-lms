<!DOCTYPE html>
<html>
<head><title>Edit Book</title></head>
<body>
    <h1>Edit Book</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Title:</label><br>
        <input type="text" name="title" value="{{ book.title }}" required><br><br>
        <label>Author:</label><br>
        <input type="text" name="author" value="{{ book.author }}" required><br><br>
        <label>ISBN:</label><br>
        <input type="text" name="isbn" value="{{ book.isbn }}" required><br><br>
        <label>Total Copies:</label><br>
        <input type="number" name="total_copies" value="{{ book.total_copies }}" required><br><br>
        <button type="submit">Save Changes</button>
    </form>
</body>
</html>
