<!DOCTYPE html>
<html>
<head><title>Members</title></head>
<body>
    <h1>All Members</h1>
    <a href="{% url 'add_member' %}">+ Add New Member</a>
    <table border="1" cellpadding="8">
        <tr>
            <th>Name</th><th>Email</th><th>Is active</th><th>Actions</th>
        </tr>
        {% for member in members %}
        <tr>
            <td>{{ member.name }}</td>
            <td>{{ member.email }}</td>
            <td>{{ member.is_active }}</td>
            <td>
                <a href="{% url 'edit_member' member.id %}">Edit</a> |
                <a href="{% url 'delete_member' member.id %}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
